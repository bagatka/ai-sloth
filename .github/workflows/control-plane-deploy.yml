name: Control plane / Deploy
run-name: Control plane / Deploy / production

# Deploys main to Azure with `dotnet aspire deploy` (docs/self-hosting.md) after every push to it
# that changes more than the landing page, once its journeys pass, with the nook images main published
# for the same commit; run by hand, it deploys main again. The production environment holds the deployment's secrets and settings, and
# only main deploys to it; GitHub's OIDC token signs in to Azure, so no Azure secret is stored.
on:
  push:
    branches: [main]
    # The landing page alone changes nothing here; Site / Publish publishes it.
    paths-ignore:
      - site/**
      - .github/workflows/site-publish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A newer push replaces a run still waiting here, so only the newest commit deploys.
  ready:
    name: Control plane / Wait for images and journeys
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: control-plane-deploy-ready
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
    outputs:
      repository: ${{ steps.images.outputs.repository }}
    steps:
      # GHCR names are lowercase; an owner's name may not be.
      - name: Name the image repository
        id: images
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Nooks start from this commit's images, which Nook images / Publish makes after every push.
      - name: Wait for this commit's nook images
        env:
          REPOSITORY: ${{ steps.images.outputs.repository }}
        run: |
          for image in aisloth-nook aisloth-nook-claude-code aisloth-nook-codex aisloth-nook-pi aisloth-nook-copilot; do
            for attempt in $(seq 1 40); do
              if docker manifest inspect "$REPOSITORY/$image:$GITHUB_SHA" > /dev/null 2>&1; then
                break
              fi
              if [ "$attempt" = 40 ]; then
                echo "::error::$REPOSITORY/$image:$GITHUB_SHA isn't published; run Nook images / Publish for this commit (a commit that changed only the landing page publishes none)."
                exit 1
              fi
              sleep 30
            done
          done

      # Branches' validations skip the journeys, so only main's counts.
      - name: Wait for this commit's validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dotnet-solution-validate.yml --branch main --commit "$GITHUB_SHA" --json status,conclusion --jq 'map(select(.status == "completed")) | .[0].conclusion // ""')
            if [ "$conclusion" = success ]; then
              exit 0
            fi
            if [ -n "$conclusion" ]; then
              echo "::error::.NET solution / Validate ended with '$conclusion' for $GITHUB_SHA; deploy a commit whose validation passed."
              exit 1
            fi
            sleep 30
          done
          echo "::error::.NET solution / Validate didn't finish for $GITHUB_SHA within 30 minutes; a commit that changed only the landing page runs none, so run it on main first."
          exit 1

  # A deploy that started always finishes; the next one waits for it.
  deploy:
    name: Control plane / Deploy to production
    needs: ready
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    concurrency:
      group: control-plane-deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Only the Aspire CLI, at the version dotnet-tools.json pins: restoring every tool at once mixed
      # up their packages on the runner.
      - name: Install the pinned Aspire CLI
        run: |
          dotnet tool install aspire.cli --tool-path "$RUNNER_TEMP/tools" --version "$(jq -r '.tools["aspire.cli"].version' dotnet-tools.json)"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Deploy
        run: aspire deploy --non-interactive
        env:
          Azure__SubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          Azure__ResourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          Azure__Location: ${{ secrets.AZURE_LOCATION }}
          Parameters__nook-image-repository: ${{ needs.ready.outputs.repository }}
          Parameters__nook-image-tag: ${{ github.sha }}
          Parameters__postgres-connection-string: ${{ secrets.POSTGRES_CONNECTION_STRING }}
          Parameters__agent-accounts-key: ${{ secrets.AGENT_ACCOUNTS_KEY }}
          Parameters__sources-key: ${{ secrets.SOURCES_KEY }}
          Parameters__secrets-key: ${{ secrets.SECRETS_KEY }}
          Parameters__custom-domain: ${{ vars.CUSTOM_DOMAIN }}
          Parameters__custom-domain-certificate: ${{ vars.CUSTOM_DOMAIN_CERTIFICATE }}
          Parameters__allow-chatgpt-plans: ${{ vars.ALLOW_CHATGPT_PLANS }}
