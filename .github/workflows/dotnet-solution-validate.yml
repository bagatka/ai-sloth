name: .NET solution / Validate
run-name: >-
  .NET solution / Validate /
  ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-dotnet-solution:
    name: .NET solution / Build, audit, style & test
    runs-on: ubuntu-latest
    # The end-to-end tests pull PostgreSQL and build the nook image (SDK image and an AOT compile).
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Docker provider runs nooks under Sysbox, so their own Docker works without privileges.
      - name: Install Sysbox
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/sysbox.deb" \
            https://github.com/nestybox/sysbox/releases/download/v0.7.1/sysbox-ce_0.7.1.linux_amd64.deb
          echo "9d6d5484f980d0a17f86c492c1262015c2afb66280bdb97215b79fde6a0261c5  $RUNNER_TEMP/sysbox.deb" | sha256sum --check
          sudo apt-get update
          sudo apt-get install --yes "$RUNNER_TEMP/sysbox.deb"

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore locked NuGet packages and audit vulnerabilities
        run: dotnet restore AiSloth.slnx --locked-mode

      - name: Build Release with analyzers and warnings as errors
        run: dotnet build AiSloth.slnx --configuration Release --no-restore -warnaserror

      - name: Verify C# formatting and code style
        run: dotnet format AiSloth.slnx --verify-no-changes --no-restore

      - name: Run tests
        run: dotnet test --solution AiSloth.slnx --configuration Release --no-build
