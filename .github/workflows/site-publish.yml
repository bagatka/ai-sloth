name: Site / Publish
run-name: Site / Publish

# Publishes the landing page (site/, Astro) to GitHub Pages, served at aisloth.dev, after every push
# to main that changes it. GitHub signs the deploy with the workflow's own token, so no secret is
# stored; the custom domain is a repository setting.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/site-publish.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer push publishes after the one in progress, never in the middle of it.
concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  build:
    name: Site / Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Packages' install scripts don't run; the build needs none.
      - name: Build the site
        working-directory: site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Keep the site for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  publish:
    name: Site / Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Named for what it serves; GitHub's default name for a Pages environment is github-pages.
    environment:
      name: website
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
