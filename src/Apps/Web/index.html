<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f0" />
    <!-- The host serving this page fills these in: where the app lives and its API's address. -->
    <base href="/app/" />
    <meta name="aisloth-api" content="" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>AiSloth</title>
    <script>
      // The saved theme applies before the first paint, so dark mode never flashes light. The two
      // colors are the grounds in src/index.css, which isn't loaded yet when this runs.
      ;(() => {
        let theme = "system"
        try {
          theme = localStorage.getItem("theme") ?? "system"
        } catch {}
        const dark =
          theme === "dark" ||
          (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
        document.querySelector('meta[name="theme-color"]').content = dark ? "#111210" : "#f3f4f0"
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
